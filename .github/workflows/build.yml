# Builds and tests on Windows and Linux. Every run keeps both binaries as artifacts;
# a tag like v0.1.1 publishes the manager and the launcher as a GitHub release,
# so players do not need Rust.
name: build
on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            manager_bin: pz-mod-manager.exe
            manager_asset: pz-mod-manager-windows-x64.exe
            launcher_bin: pz-launcher.exe
            launcher_asset: pz-launcher-windows-x64.exe
          - os: ubuntu-latest
            manager_bin: pz-mod-manager
            manager_asset: pz-mod-manager-linux-x64
            launcher_bin: pz-launcher
            launcher_asset: pz-launcher-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1 libegl1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Serial tests: the cli and mcp tests share one config file, and two cores
      # were enough for one test to read the other's broken fixture.
      - run: cargo test --release --workspace -- --test-threads=1
      - run: cargo build --release --workspace
      - name: Collect binaries
        shell: bash
        run: |
          cp "target/release/${{ matrix.manager_bin }}" "${{ matrix.manager_asset }}"
          cp "target/release/${{ matrix.launcher_bin }}" "${{ matrix.launcher_asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-binaries
          path: |
            ${{ matrix.manager_asset }}
            ${{ matrix.launcher_asset }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.manager_asset }}
            ${{ matrix.launcher_asset }}

  # Каждый пуш в master пересоздаёт сборку «nightly»: из неё берёт обновление кнопка в программе.
  # Первая строка описания `commit: <sha>` сравнивается с коммитом, вшитым в запущенный файл.
  nightly:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true
      - name: Publish nightly
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          gh release delete nightly --cleanup-tag -y --repo "$REPO" || true
          printf 'commit: %s\n%s\n' "$SHA" "$MSG" > notes.txt
          gh release create nightly --prerelease --target "$SHA" --title nightly --notes-file notes.txt --repo "$REPO" bin/*
