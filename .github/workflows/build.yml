# Builds and tests on Windows and Linux. Every run keeps the binary as an artifact;
# a tag like v0.2.0 publishes it as a GitHub release, so players do not need Rust.
# The build scripts (scripts/*.bat, scripts/*.sh) are run for real on each OS, so a broken
# script shows up here and not on a player's machine.
name: build
on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            manager_bin: pz-mod-manager.exe
            manager_asset: pz-mod-manager-windows-x64.exe
          - os: ubuntu-latest
            manager_bin: pz-mod-manager
            manager_asset: pz-mod-manager-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1 libegl1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Serial tests: the cli and mcp tests share one config file, and two cores
      # were enough for one test to read the other's broken fixture.
      - run: cargo test --release --workspace -- --test-threads=1
      - run: cargo build --release --workspace

      # The scripts a person runs by hand. The runner already has Visual Studio and Rust, so
      # install.bat must pass without winget (it needs winget only for what is missing).
      - name: Windows scripts (install.bat --deps-only, build.bat, run the CLI)
        if: runner.os == 'Windows'
        shell: cmd
        timeout-minutes: 20
        run: |
          call scripts\install.bat --deps-only
          if errorlevel 1 exit /b 1
          call scripts\build.bat
          if errorlevel 1 exit /b 1
          if not exist target\release\pz-mod-manager.exe exit /b 1
          target\release\pz-mod-manager.exe version
          if errorlevel 1 exit /b 1
          target\release\pz-mod-manager.exe help
      - name: Linux scripts (build.sh, run the CLI)
        if: runner.os == 'Linux'
        run: |
          ./scripts/build.sh
          ./target/release/pz-mod-manager version
          ./target/release/pz-mod-manager help > /dev/null

      - name: Collect binary
        shell: bash
        run: cp "target/release/${{ matrix.manager_bin }}" "${{ matrix.manager_asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-binaries
          path: ${{ matrix.manager_asset }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ matrix.manager_asset }}

  # Каждый пуш в master пересоздаёт сборку «nightly»: из неё берёт обновление кнопка в программе.
  # Первая строка описания `commit: <sha>` сравнивается с коммитом, вшитым в запущенный файл.
  nightly:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true
      - name: Publish nightly
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          gh release delete nightly --cleanup-tag -y --repo "$REPO" || true
          printf 'commit: %s\n%s\n' "$SHA" "$MSG" > notes.txt
          gh release create nightly --prerelease --target "$SHA" --title nightly --notes-file notes.txt --repo "$REPO" bin/*
